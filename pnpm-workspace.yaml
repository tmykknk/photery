allowBuilds:
  # Next.jsが任意依存として解決するsharpのpostinstallを許可する。
  sharp: true
  unrs-resolver: true
  esbuild: true
  workerd: true

supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc

overrides:
  postcss: 8.5.10

minimumReleaseAgeExclude:
  - "@cloudflare/workerd-darwin-64@1.20261110.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261110.1"
  - "@cloudflare/workerd-linux-64@1.20261110.1"
  - "@cloudflare/workerd-linux-arm64@1.20261110.1"
  - "@cloudflare/workerd-windows-64@1.20261110.1"
  - "@cloudflare/workers-types@5.20261110.1"
  - "@next/env@16.4.6"
  - "@next/swc-darwin-arm64@16.4.6"
  - "@next/swc-darwin-x64@16.4.6"
  - "@next/swc-linux-arm64-gnu@16.4.6"
  - "@next/swc-linux-arm64-musl@16.4.6"
  - "@next/swc-linux-x64-gnu@16.4.6"
  - "@next/swc-linux-x64-musl@16.4.6"
  - "@next/swc-win32-arm64-msvc@16.4.6"
  - "@next/swc-win32-x64-msvc@16.4.6"
  - framer-motion@14.12.0
  - miniflare@5.20261110.0-beta
  - motion-dom@14.12.0
  - next@16.4.6
  - workerd@1.20261110.1
  - wrangler@4.160.0
